name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --icon icon.ico --add-data "icon.ico;." --version-file version_info.txt --name GoogleDriveFolderDownloader gdrive_downloader.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleDriveFolderDownloader
          path: dist/GoogleDriveFolderDownloader.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoogleDriveFolderDownloader.exe
          generate_release_notes: true
